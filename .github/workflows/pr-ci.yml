name: PR CI

# Checks every pull request before it merges (Bruce 2026-11-26: PRs merge when CI is green).
# Runs on the org's Hayabuild Linux runner (hayabuild-linux) instead of a GitHub-hosted one.
# Fork PRs from outside contributors run only after a maintainer approves them (the repository
# requires approval for all external contributors). No secrets needed.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: hayabuild-linux
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
