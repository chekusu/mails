name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: hayabuild-macos
            target: bun-darwin-arm64
            artifact: mails-darwin-arm64
          - os: hayabuild-macos
            target: bun-darwin-x64
            artifact: mails-darwin-x64
          - os: hayabuild-linux
            target: bun-linux-x64
            artifact: mails-linux-x64
          # No arm64 Linux runner: bun cross-compiles from x64, as darwin-x64 does on the arm64 Mac.
          - os: hayabuild-linux
            target: bun-linux-arm64
            artifact: mails-linux-arm64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - run: bun install
      - run: bun build src/cli/index.ts --compile --target=${{ matrix.target }} --outfile ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          # Only hands the binary to the release job below.
          retention-days: 1

  release:
    needs: build
    runs-on: hayabuild-linux
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*

  publish:
    # Stays GitHub-hosted: npm trusted publishing and --provenance accept only GitHub-hosted runners.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install
      - run: bun run build
      - run: bun run typecheck
      - name: Run tests
        run: bun test --concurrency 1 test/unit/ test/e2e/flow.test.ts test/e2e/sqlite-search.test.ts
        continue-on-error: true

      - name: Publish mails
        run: npm publish --provenance --access public
